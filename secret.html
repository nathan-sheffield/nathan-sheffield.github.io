permalink: /secret/
exclude_from_nav: true
---

<style>
  #secret-loading {
    color: #888;
    font-style: italic;
  }
  #secret-error {
    color: #ef9a9a;
    background: #3a1b1b;
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid #f44336;
    display: none;
  }
  .secret-post-header {
    margin-bottom: 1.5em;
  }
  .secret-post-header h1 {
    margin-bottom: 0.2em;
  }
  .secret-post-header .meta {
    color: #888;
    font-size: 0.9em;
  }
  .secret-body {
    line-height: 1.7;
  }
  .secret-body img {
    max-width: 100%;
    height: auto;
  }
</style>

<div id="secret-loading">Decrypting...</div>
<div id="secret-error"></div>
<div id="secret-content"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/assets/js/decrypt.js"></script>
<script>
  // Allow raw HTML (including <script>) to pass through marked
  marked.setOptions({ breaks: false });
  // Use a custom renderer that doesn't sanitize HTML
  const renderer = new marked.Renderer();
  renderer.html = function(token) {
    // token may be a string or object depending on marked version
    return typeof token === 'string' ? token : (token.raw || token.text || '');
  };
  marked.use({ renderer: renderer });

  const loadingEl = document.getElementById("secret-loading");
  const errorEl = document.getElementById("secret-error");
  const contentEl = document.getElementById("secret-content");

  function showError(msg) {
    loadingEl.style.display = "none";
    errorEl.style.display = "block";
    errorEl.textContent = msg;
  }

  function getParams() {
    const hash = window.location.hash.substring(1);
    const params = {};
    for (const part of hash.split("&")) {
      const [k, v] = part.split("=");
      if (k && v) params[k] = decodeURIComponent(v);
    }
    return params;
  }

  async function loadSecret() {
    const params = getParams();
    const fileIndex = params.file;
    const fileKey = params.key;

    if (fileIndex === undefined || !fileKey) {
      // No specific file requested — try to show a listing from stored passwords
      await showListing();
      return;
    }

    try {
      const markdown = await SecretContent.decryptFile(parseInt(fileIndex), fileKey);

      loadingEl.style.display = "none";

      // Try to find metadata from stored passwords
      const { unlockedEntries } = await SecretContent.unlockAll();
      const entry = unlockedEntries.find(e => e.fileIndex === parseInt(fileIndex));

      let html = "";
      if (entry && entry.metadata) {
        html += '<div class="secret-post-header">';
        html += `<h1>${entry.metadata.title}</h1>`;
        if (entry.metadata.date) {
          html += `<div class="meta">${entry.metadata.date}</div>`;
        }
        html += "</div>";
        // Update page title
        document.title = entry.metadata.title + " | Secret";
      }

      html += '<div class="secret-body">' + marked.parse(markdown) + "</div>";
      contentEl.innerHTML = html;

      // innerHTML doesn't execute <script> tags — re-create them so they run
      contentEl.querySelectorAll("script").forEach(oldScript => {
        const newScript = document.createElement("script");
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        oldScript.replaceWith(newScript);
      });

      // Re-render MathJax if available
      if (window.MathJax && MathJax.Hub) {
        MathJax.Hub.Queue(["Typeset", MathJax.Hub, contentEl]);
      }

    } catch (err) {
      showError("Could not decrypt this content. You may need to enter the correct password on the Textbox page first.");
      console.error(err);
    }
  }

  async function showListing() {
    loadingEl.style.display = "none";
    try {
      const { unlockedEntries } = await SecretContent.unlockAll();
      if (unlockedEntries.length === 0) {
        contentEl.innerHTML = '<p>No secret content unlocked. <a href="/mystery-textbox/">Enter a password</a> first.</p>';
        return;
      }

      let html = "<h2>Your Unlocked Content</h2>";
      for (const entry of unlockedEntries) {
        html += `<p><a href="/secret/#file=${entry.fileIndex}&key=${entry.fileKey}">${entry.metadata.title}</a>`;
        if (entry.metadata.date) html += ` <em style="color:#888">${entry.metadata.date}</em>`;
        html += "</p>";
      }
      contentEl.innerHTML = html;
    } catch {
      contentEl.innerHTML = '<p>No secret content unlocked. <a href="/mystery-textbox/">Enter a password</a> first.</p>';
    }
  }

  loadSecret();
  window.addEventListener("hashchange", () => {
    loadingEl.style.display = "block";
    errorEl.style.display = "none";
    contentEl.innerHTML = "";
    loadSecret();
  });
</script>
