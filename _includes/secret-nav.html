<!-- Secret nav: reveals hidden navigation items when passwords are stored -->
<script>
(function() {
  var stored;
  try { stored = JSON.parse(localStorage.getItem("secret-passwords")); } catch(e) {}
  if (!stored || !stored.length) return;

  var script = document.createElement("script");
  script.src = "/assets/js/decrypt.js";
  script.onload = function() {
    SecretContent.refreshNav();
  };
  document.head.appendChild(script);
})();
</script>
