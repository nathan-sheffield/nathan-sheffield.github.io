<style>

    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 2em auto;
    max-width: 500px;
  }

    width: 100%;
    padding: 12px 16px;
    font-size: 1em;
    border: 2px solid #555;
    border-radius: 6px;
    background: #2a2730;
    color: #c7b8d3;
    font-family: monospace;
    text-align: center;
    box-sizing: border-box;
  }
  .mystery-form input[type="text"]:focus {
    outline: none;
    border-color: #7c4dff;
  }
  .mystery-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .mystery-buttons button {
    padding: 10px 20px;
    font-size: 1em;
    border: 2px solid #7c4dff;
    border-radius: 6px;
    background: #7c4dff;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
  }
  .mystery-buttons button:hover {
    background: #651fff;
  }
  .mystery-buttons .send-btn {
    border-color: #555;
    background: transparent;
    color: #888;
  }
  .mystery-buttons .send-btn:hover {
    border-color: #bb86fc;
    background: transparent;
    color: #bb86fc;
  }
  #mystery-status {
    margin: 1em auto;
    padding: 10px 14px;
    border-radius: 6px;
    display: none;
    max-width: 500px;
    text-align: center;
  }
  #mystery-status.success {
    display: block;
    background: #1a1a2e;
    border: 1px solid #7c4dff;
    color: #bb86fc;
  }
  #mystery-status.error {
    display: block;
    background: #1a1a1a;
    border: 1px solid #555;
    color: #888;
  }
  #mystery-status.info {
    display: block;
    background: #1a1a1a;
    border: 1px solid #444;
    color: #aaa;
  }
  .unlocked-list {
    margin-top: 2em;
  }
  .unlocked-list h3 {
    margin-bottom: 0.5em;
  }
  .unlocked-item {
    padding: 8px 0;
    border-bottom: 1px solid #333;
  }
  .unlocked-item a {
    color: #bb86fc;

  }
  .unlocked-item a:hover {
    text-decoration: underline;
  }
  .unlocked-item .item-meta {
    font-size: 0.85em;
    color: #888;
  }
  .unlocked-item.letter-item {
    position: relative;
    padding: 12px 14px 12px 52px;
    margin: 8px 0;
    background: linear-gradient(135deg, rgba(187,134,252,0.04) 0%, rgba(124,77,255,0.08) 100%);
    border: 1px solid #3a2f4a;
    border-left: 3px solid #7c4dff;
    border-radius: 4px;
    font-family: Georgia, "Times New Roman", serif;
  }
  .unlocked-item.letter-item::before {
    content: "✉";
    position: absolute;
    left: 16px;
    top: 14px;
    font-size: 1.6em;
    color: #bb86fc;

  .unlocked-item.letter-item a {
    font-style: italic;

  .unlocked-item.letter-item .letter-date {
    display: inline-block;
    margin-left: 10px;
    padding: 1px 7px;
    font-size: 0.72em;
    color: #aaa;
    border: 1px dashed #6a5a80;
    border-radius: 2px;
    font-style: italic;

  }
  #stored-passwords {
    margin-top: 2em;
    font-size: 0.9em;
    color: #888;
  }
  #stored-passwords button {

    border: 1px solid #555;
    color: #888;
    padding: 2px 8px;

<div class="mystery-form">
  <input type="text" id="mystery-password" placeholder="" autocomplete="off"
         onkeydown="if(event.key==='Enter')document.getElementById('mystery-submit').click()">
  <div class="mystery-buttons">
    <button id="mystery-submit" onclick="handleSubmit()">Check</button>
  </div>
</div>

<iframe name="send-target" style="display:none;"></iframe>
<div id="mystery-status"></div>
<div id="unlocked-content"></div>
<div id="stored-passwords"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/assets/js/decrypt.js"></script>
<script>
  const statusEl = document.getElementById("mystery-status");
  const contentEl = document.getElementById("unlocked-content");
  const storedEl = document.getElementById("stored-passwords");

  function setStatus(msg, cls) {
    statusEl.dataset.animating = "false";
    statusEl.textContent = msg;
    statusEl.className = cls;
  }

  async function handleSubmit() {
    const input = document.getElementById("mystery-password");
    const password = input.value.trim();
    if (!password) return;

    setStatus("Considering", "info");
    statusEl.dataset.animating = "true";
    let dots = 0;
    const dotInterval = setInterval(() => {
      if (statusEl.dataset.animating !== "true") { clearInterval(dotInterval); return; }
      dots = (dots + 1) % 4;
      statusEl.textContent = "Considering" + ".".repeat(dots);
    }, 400);

    try {
      const result = await SecretContent.submitPassword(password);
      if (result.success) {
        // Check if any newly unlocked entry is a dialogue response
        const dialogue = result.entries.find(e => e.metadata.dialogue_response);
        if (dialogue) {
          setStatus(dialogue.metadata.dialogue_response, dialogue.metadata.dialogue_style || "error");
        } else {
          setStatus("Oh, a most sumptuous secret! Perhaps I can offer you something in return...", "success");
        }
        input.value = "";
        const newIds = new Set(result.entries.map(e => e.fileIndex));
        await refreshUnlocked(newIds);
        await SecretContent.refreshNav();
        await checkSendFeature();
      } else {
        setStatus("No no, that simply will not do.", "error");
      }
    } catch (err) {
      setStatus("Error: " + err.message, "error");
    }
  }

  async function refreshUnlocked(newIds = new Set()) {
    try {
      const { unlockedEntries, passwords } = await SecretContent.unlockAll();
      const newCls = (id) => newIds.has(id) ? " new-unlock" : "";

      if (unlockedEntries.length === 0) {
        contentEl.innerHTML = "";
        storedEl.innerHTML = "";
        return;
      }

      // Split into grouped entries, standalone pages, and other
      const grouped = {};
      const standalone = [];
      const other = [];
      unlockedEntries.forEach(e => {
        if (e.metadata.groupHash) {
          if (!grouped[e.metadata.groupHash]) grouped[e.metadata.groupHash] = [];
          grouped[e.metadata.groupHash].push(e);
        } else if (e.metadata.nav_title) {
          standalone.push(e);
        } else if (!e.metadata.feature) {
          other.push(e);
        }
      });

      let html = '<div class="unlocked-list">';
      html += `<h3>Secrets</h3>`;

      // Check for send-button feature
      const sendFeature = unlockedEntries.find(e => e.metadata.feature === "send-button");
      if (sendFeature) {
        const href = "/secret/#file=" + sendFeature.fileIndex + "&key=" + sendFeature.fileKey;
        html += `<div class="unlocked-item${newCls(sendFeature.fileIndex)}">`;
        html += `<a href="${href}">Troll-free call</a>`;
        html += `<br><span class="item-meta">${sendFeature.metadata.excerpt || "Send anonymous messages to Nathan from the textbox."}</span>`;
        html += `</div>`;
      }

      // Check for viewable dialogue rewards (e.g. the award)
      const rewards = unlockedEntries.filter(e => e.metadata.feature === "dialogue" && e.metadata.excerpt);
      for (const entry of rewards) {
        const href = "/secret/#file=" + entry.fileIndex + "&key=" + entry.fileKey;
        html += `<div class="unlocked-item${newCls(entry.fileIndex)}">`;
        html += `<a href="${href}">${entry.metadata.title}</a>`;
        html += `<br><span class="item-meta">${entry.metadata.excerpt}</span>`;
        html += `</div>`;
      }

      for (const [hash, entries] of Object.entries(grouped)) {
        const label = entries[0].metadata.group || "???";
        const groupHasNew = entries.some(e => newIds.has(e.fileIndex));
        const hub = entries.find(e => e.metadata.is_hub);
        html += `<div class="unlocked-item${groupHasNew ? " new-unlock" : ""}">`;
        html += `<a href="/g/#${hash}">${label}</a>`;
        if (hub && hub.metadata.excerpt) {
          html += `<br><span class="item-meta">${hub.metadata.excerpt}</span>`;
        }
        html += `</div>`;
      }

      const renderEntry = (entry, displayTitle) => {
        const href = entry.metadata.permalink || ("/secret/#file=" + entry.fileIndex + "&key=" + entry.fileKey);
        const isLetter = entry.metadata.category === "letter";
        const cls = isLetter ? "unlocked-item letter-item" : "unlocked-item";
        let out = `<div class="${cls}${newCls(entry.fileIndex)}">`;
        out += `<a href="${href}">${displayTitle}</a>`;
        if (isLetter && entry.metadata.date) {
          out += ` <span class="letter-date">${entry.metadata.date}</span>`;
        }
        if (entry.metadata.excerpt) {
          out += `<br><span class="item-meta">${entry.metadata.excerpt}</span>`;
        }
        out += `</div>`;
        return out;
      };

      for (const entry of standalone) {
        html += renderEntry(entry, entry.metadata.nav_title || entry.metadata.title);
      }

      for (const entry of other) {
        html += renderEntry(entry, entry.metadata.title);
      }

      html += "</div>";
      contentEl.innerHTML = html;

      // Show stored passwords with remove buttons
      let pwHtml = `<p><button onclick="forgetAll()">forget all secrets</button></p>`;
      storedEl.innerHTML = pwHtml;

    } catch (err) {
      console.error("Error refreshing unlocked content:", err);
    }
  }

  function forgetAll() {
    SecretContent.clearPasswords();
    contentEl.innerHTML = "";
    storedEl.innerHTML = "";
    setStatus("All secrets forgotten.", "info");
  }

  // --- "Bug Nathan" feature (fully dynamic) ---
  async function checkSendFeature() {
    try {
      const { unlockedEntries } = await SecretContent.unlockAll();
      const feature = unlockedEntries.find(e => e.metadata.feature === "send-button");
      const buttons = document.querySelector(".mystery-buttons");
      if (feature && buttons && !buttons.querySelector(".send-btn")) {
        const btn = document.createElement("button");
        btn.className = "send-btn";
        btn.textContent = feature.metadata.title || "Send";
        btn.addEventListener("click", () => {
          const input = document.getElementById("mystery-password");
          const message = input.value.trim();
          if (!message) return;
          setStatus("Sending...", "info");
          try {
            const formData = new FormData();
            formData.append(feature.metadata.form_entry_id, message);
            navigator.sendBeacon(feature.metadata.form_endpoint, formData);
            setStatus("Sent!", "success");
            input.value = "";
          } catch (err) {
            setStatus("Failed to send: " + err.message, "error");
          }
        });
        buttons.appendChild(btn);
      }
    } catch {}
  }

  // On page load, show any already-unlocked content
  refreshUnlocked();
  checkSendFeature();
</script>
